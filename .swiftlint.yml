disabled_rules:
- redundant_objc_attribute
- trailing_whitespace
- multiple_closures_with_trailing_closure
- for_where
- implicit_getter
- empty_string
- legacy_random
- unused_enumerated
opt_in_rules:
- empty_string
excluded:
- Carthage
- Pods
- SwiftLint/Common/3rdPartyLib
# binary rules can set their severity level
force_cast: warning # implicitly
force_try:
  severity: warning # explicitly
line_length:
    warning: 2000
    error: 3500
    ignores_function_declarations: true
    ignores_comments: true
    ignores_interpolated_strings: true
    ignores_urls: true
function_body_length:
    warning: 300
    error: 500
function_parameter_count:
    warning: 15
    error: 15
type_body_length:
    warning: 5000
    error: 10000
file_length:
    warning: 2500
    error: 3000
    ignore_comment_only_lines: true
cyclomatic_complexity:
    warning: 30
    error: 100
reporter: "xcode"
identifier_name:
    min_length: 2
