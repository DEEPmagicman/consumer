workflows:
  ios-firebase-distribution:
    name: iOS Firebase Distribution Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: consumer_v2_implementation
          include: true
      cancel_previous_builds: true

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "com.project.speakeasy-consumer"

      vars:
        XCODE_WORKSPACE: "SpeakEasy-Consumer.xcworkspace"
        XCODE_SCHEME: "SpeakEasy-Consumer"
        FIREBASE_APP_ID: "1:327697476599:ios:b6acd79c05b301f1759cf2"

      cocoapods: default

      groups:
        - firebase_credentials

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install --repo-update

      - name: Resolve Swift Package Manager dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload build to Firebase App Distribution
        script: |
          firebase appdistribution:distribute build/ios/ipa/*.ipa \
            --app "$FIREBASE_APP_ID" \
            --release-notes "Automated QA build from Codemagic" \
            --groups "tester"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
