workflows:
  ios-firebase-distribution:
    name: iOS Firebase Distribution Build

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feat/redesign-v3
          include: true
      cancel_previous_builds: true

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "com.project.speakeasy-consumer"

      vars:
        XCODE_WORKSPACE: "SpeakEasy-Consumer.xcworkspace"
        XCODE_SCHEME: "SpeakEasy-Consumer"
        FIREBASE_APP_ID: "1:327697476599:ios:b6acd79c05b301f1759cf2"

      cocoapods: default

      groups:
        - firebase_credentials

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          pod install --repo-update

      - name: Resolve Swift Package Manager dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME"

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload build to Firebase App Distribution
        script: |
          firebase appdistribution:distribute build/ios/ipa/*.ipa \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$(git log -1 --pretty=%B)" \
            --groups "tester"

      - name: Upload app dSYM to Firebase Crashlytics
        script: |
          echo "Searching for app dSYM inside xcarchive..."

          APP_DSYM=$(find build/ios/xcarchive -name "*.app.dSYM" | head -1)

          if [ -n "$APP_DSYM" ]; then
            echo "Found app dSYM inside xcarchive:"
            echo "$APP_DSYM"

          else
            echo "Not found in xcarchive. Searching for zipped app dSYM..."

            APP_DSYM_ZIP=$(find . -name "*.app.dSYM.zip" | head -1)

            if [ -z "$APP_DSYM_ZIP" ]; then
              echo "No app dSYM zip found anywhere"
              find . -name "*.dSYM"
              exit 1
            fi

            echo "Found zipped app dSYM:"
            echo "$APP_DSYM_ZIP"

            unzip -o "$APP_DSYM_ZIP" -d extracted_dsyms

            APP_DSYM=$(find extracted_dsyms -name "*.app.dSYM" | head -1)
          fi

          firebase crashlytics:symbols:upload \
            --app "$FIREBASE_APP_ID" \
            "$APP_DSYM" \
            --token "$FIREBASE_TOKEN"

          echo "dSYM upload completed"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      slack:
        channel: "#cicd-ios"
        notify_on_build_start: false
        notify:
          success: true
          failure: true
