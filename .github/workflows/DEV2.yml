name: Distribute to Firebase on PR merge to DEV2

on:
  push:
    branches:
      - DEV2

jobs:
  distribute:
    name: Build & Distribute iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.0.app

      - name: Archive App
        run: |
          xcodebuild archive \
            -workspace SpeakEasy-Consumer.xcworkspace \
            -scheme SpeakEasy-Consumer \
            -configuration Release \
            -archivePath ./build/SpeakEasy-Consumer.xcarchive \
            -destination 'generic/platform=iOS'
      - name: Export IPA
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath ./build/SpeakEasy-Consumer.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build/ipa

      - name: Upload to Firebase
        run: |
          firebase appdistribution:distribute ./build/ipa/SpeakEasy-Consumer.ipa \
            --app "${{ secrets.APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "tester"
